parameters:
  paths:
    - ./src
  exclude_files: []

  layers:
    - name: Domain
      collectors:
        - type: classNameRegex
          regex: ^Domain\\\\.*
    - name: Application
      collectors:
        - type: classNameRegex
          regex: ^Application\\\\.*
    - name: Infrastructure
      collectors:
        - type: classNameRegex
          regex: ^Infrastructure\\\\.*
    - name: Presentation
      collectors:
        - type: classNameRegex
          regex: ^Presentation\\\\.*

  ruleset:
    Domain: []              # Domain imports nothing from other layers
    Application:
      - Domain
    Infrastructure:
      - Domain
      - Application
    Presentation:
      - Application
      - Infrastructure

  skip_violations: []
