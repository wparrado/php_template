parameters:
  paths:
    - ./src
  exclude_files: []

  layers:
    - name: Domain
      collectors:
        - type: classNameRegex
          value: '/^Domain\\\\.*/'
    - name: Application
      collectors:
        - type: classNameRegex
          value: '/^Application\\\\.*/'
    - name: Infrastructure
      collectors:
        - type: classNameRegex
          value: '/^Infrastructure\\\\.*/'
    - name: Presentation
      collectors:
        - type: classNameRegex
          value: '/^Presentation\\\\.*/'

  ruleset:
    Domain: []              # Domain imports nothing from other layers
    Application:
      - Domain
    Infrastructure:
      - Domain
      - Application
    Presentation:
      - Application
      - Infrastructure

  skip_violations: []
