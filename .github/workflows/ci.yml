name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  lint:
    name: Lint (Pint)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Ensure bootstrap cache directory
        run: mkdir -p bootstrap/cache && chmod -R 0777 bootstrap/cache

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-scripts && php artisan package:discover --ansi

      - name: Run Laravel Pint
        run: composer lint || true

  type-check:
    name: Type Check (PHPStan)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Ensure bootstrap cache directory
        run: mkdir -p bootstrap/cache && chmod -R 0777 bootstrap/cache

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-scripts && php artisan package:discover --ansi

      - name: Run PHPStan
        run: composer stan

  architecture:
    name: Architecture (Deptrac + PHPArkitect)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Ensure bootstrap cache directory
        run: mkdir -p bootstrap/cache && chmod -R 0777 bootstrap/cache

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-scripts && php artisan package:discover --ansi

      - name: Run Deptrac
        run: composer deptrac

      - name: Run PHPArkitect
        run: composer arkitect

  test:
    name: Tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Ensure bootstrap cache directory
        run: mkdir -p bootstrap/cache && chmod -R 0777 bootstrap/cache

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-scripts && php artisan package:discover --ansi

      - name: Copy .env
        run: cp .env.example .env && php artisan key:generate

      - name: Run unit tests
        run: vendor/bin/pest --group=unit
        env:
          APP_ENV: testing
          DB_BACKEND: memory
          EVENT_PUBLISHER: sync

      - name: Run architecture tests
        run: vendor/bin/pest tests/Architecture --group=architecture
        env:
          APP_ENV: testing
          DB_BACKEND: memory
          EVENT_PUBLISHER: sync


